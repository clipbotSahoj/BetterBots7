<body>

  <div class="bg-ambient" aria-hidden="true">
    <canvas id="bgCanvas" class="bg-canvas"></canvas>

  <header class="site-nav">

      <a href="index.html" class="nav-brand"><img src="images/logo-icon.png" alt="" class="nav-brand-logo">BETTERBOTS7</a>
      <nav class="nav-links" aria-label="Primary">

    <section class="page-hero page-hero-xl">
      <div class="hero-glow-local" aria-hidden="true"></div>
      <div class="hero-watermark" aria-hidden="true">2025</div>
      <div class="container">
        <span class="eyebrow hero-badge reveal">Season Progression</span>
        <h1 class="page-hero-title reveal">2024 → 2025</h1>
        <p class="page-hero-sub reveal">

    <!-- ============ SEASON TIMELINE ============ -->

      <div class="container">
        <div class="timeline-track">
          <div class="timeline-node reveal">
            <span class="timeline-year">2024</span>
            <span class="timeline-season">INTO THE DEEP</span>
            <div class="timeline-stats">
              <div class="timeline-stat">
                <span class="timeline-stat-value"><span class="stat-count" data-target="8">0</span><span class="timeline-stat-sep">–</span><span class="stat-count" data-target="7">0</span></span>

              </div>
              <div class="timeline-stat">
                <span class="timeline-stat-text">2nd Place</span>
                <span class="timeline-stat-label">Design Award — League Tournament</span>
              </div>
            </div>
          </div>

          <div class="timeline-connector" aria-hidden="true"></div>

          <div class="timeline-node reveal">
            <span class="timeline-year">2025</span>
            <span class="timeline-season">DECODE</span>
            <div class="timeline-stats">
              <div class="timeline-stat">
                <span class="timeline-stat-value"><span class="stat-count" data-target="10">0</span><span class="timeline-stat-sep">–</span><span class="stat-count" data-target="5">0</span></span>

              <div class="timeline-stat">
                <span class="timeline-stat-value"><span class="stat-count" data-target="10">0</span><span class="timeline-stat-sep">/</span><span class="stat-count" data-target="23">0</span></span>
