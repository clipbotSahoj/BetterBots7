<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Photos of FTC Team 25907, BetterBots7, in the shop and at competition.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="images/favicon.png?v=4">
  <link rel="stylesheet" href="css/style.css?v=15">
</head>
<body>

  <div class="bg-ambient" aria-hidden="true">
    <canvas id="bgCanvas" class="bg-canvas"></canvas>
  </div>

  <header class="site-nav">
    <div class="container nav-inner">
      <a href="index.html" class="nav-brand"><img src="images/logo-icon.png" alt="" class="nav-brand-logo">BETTERBOTS7</a>
      <nav class="nav-links" aria-label="Primary">
        <a href="about.html">About</a>
        <a href="robot.html">Robot</a>
        <a href="seasons.html">Seasons</a>
        <a href="gallery.html" aria-current="page">Gallery</a>
        <a href="sponsors.html">Sponsors</a>
        <a href="join.html" class="nav-cta">Join Us</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero page-hero-xl">
      <div class="hero-glow-local" aria-hidden="true"></div>
      <div class="hero-watermark" aria-hidden="true">GALLERY</div>
      <div class="container">
        <span class="eyebrow hero-badge reveal">In The Shop &amp; At Competition</span>
        <h1 class="page-hero-title reveal">Gallery</h1>
        <p class="page-hero-sub reveal">2024 and 2025 seasons — robots, the team, and competition day.</p>
      </div>
    </section>

    <section>
      <div class="container">
        <div class="gallery-grid">

          <button class="gallery-item reveal" data-caption="2024 robot — INTO THE DEEP season">
            <img src="images/gallery/2024-robot-front.png" alt="BetterBots7's 2024 robot, front view, INTO THE DEEP season" loading="lazy">
            <span class="gallery-item-caption">2024 Robot — INTO THE DEEP</span>
          </button>

          <button class="gallery-item reveal" data-caption="2024 robot, showing team number 25907">
            <img src="images/gallery/2024-robot-numbered.png" alt="BetterBots7's 2024 robot with team number 25907 visible" loading="lazy">
            <span class="gallery-item-caption">2024 Robot — #25907</span>
          </button>

          <button class="gallery-item reveal" data-caption="The team at the Pingry tournament">
            <img src="images/gallery/2025-team-pit.png" alt="BetterBots7 team members standing with their robot at the Pingry tournament" loading="lazy">
            <span class="gallery-item-caption">Team at Pingry Tournament</span>
          </button>

          <button class="gallery-item reveal" data-caption="2025 robot in the pit area">
            <img src="images/gallery/2025-robot-pit-blue.png" alt="BetterBots7's 2025 robot on the pit table" loading="lazy">
            <span class="gallery-item-caption">2025 Robot — In the Pit</span>
          </button>

          <button class="gallery-item reveal" data-caption="2025 robot on the competition field">
            <img src="images/gallery/2025-robot-field-tag.png" alt="BetterBots7's 2025 robot on the competition field near an AprilTag marker" loading="lazy">
            <span class="gallery-item-caption">2025 Robot — On the Field</span>
          </button>

          <button class="gallery-item reveal" data-caption="Team member at the pit table">
            <img src="images/gallery/2025-team-member.png" alt="A BetterBots7 team member at the pit table during a tournament" loading="lazy">
            <span class="gallery-item-caption">In the Pit</span>
          </button>

          <button class="gallery-item reveal" data-caption="2025 robot — DECODE season">
            <img src="images/gallery/2025-robot-full.png" alt="BetterBots7's 2025 robot, full view, DECODE season" loading="lazy">
            <span class="gallery-item-caption">2025 Robot — DECODE</span>
          </button>

          <button class="gallery-item reveal" data-caption="2025 robot mechanism close-up">
            <img src="images/gallery/2025-robot-closeup.png" alt="Close-up of BetterBots7's 2025 robot drive and mechanism" loading="lazy">
            <span class="gallery-item-caption">2025 Robot — Mechanism</span>
          </button>

          <button class="gallery-item reveal" data-caption="2025 robot in competition action">
            <img src="images/gallery/2025-robot-field-action.png" alt="BetterBots7's 2025 robot in action on the competition field" loading="lazy">
            <span class="gallery-item-caption">Competition Action</span>
          </button>

          <button class="gallery-item reveal" data-caption="2025 robot, studio view">
            <img src="images/gallery/2025-robot-blue-bg.png" alt="BetterBots7's 2025 robot against a blue background" loading="lazy">
            <span class="gallery-item-caption">2025 Robot</span>
          </button>

        </div>
      </div>
    </section>
  </main>

  <!-- ============ LIGHTBOX ============ -->
  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lightbox-prev" aria-label="Previous photo">‹</button>
    <div class="lightbox-figure">
      <img class="lightbox-img" id="lightboxImg" src="" alt="">
      <p class="lightbox-caption" id="lightboxCaption"></p>
    </div>
    <button class="lightbox-next" aria-label="Next photo">›</button>
    <button class="lightbox-close" aria-label="Close photo viewer">×</button>
  </div>

  <script src="js/main.js?v=4" defer></script>
</body>
</html>
